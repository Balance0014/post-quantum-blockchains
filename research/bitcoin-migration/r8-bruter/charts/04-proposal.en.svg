<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780">
<title>What should a proposal explain?</title>
<desc>Questions for a migration proposal: spending conditions and protection scope, activation and service support, holder action and recovery, deadlines and the rights of funds left behind.</desc>
<rect width="1800" height="1780" fill="#F6F4EE"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="80" y="80" font-size="27" font-weight="700" fill="#117F79">BITCOIN / POST-QUANTUM MIGRATION</text>
<text x="1570" y="80" font-size="27" font-weight="700" fill="#117F79">04 / 04</text>
<text x="80" y="185" font-size="66" font-weight="700" fill="#172D35">What should a proposal explain?</text>
<text x="80" y="277" font-size="33" font-weight="400" fill="#52656B">Follow the rules, the services and the holders through the proposed transition.</text>
<rect x="80.0" y="410" width="800.0" height="335" rx="22" fill="#E7F1EC"/>
<text x="114.0" y="466" font-size="37" font-weight="700" fill="#172D35">Protection scope</text>
<text x="114.0" y="518" font-size="31" font-weight="400" fill="#172D35">Which spending conditions change?</text>
<text x="114.0" y="569" font-size="31" font-weight="400" fill="#172D35">Which funds would the new rules protect?</text>
<text x="114.0" y="620" font-size="31" font-weight="400" fill="#172D35">Which funds would stay under old rules?</text>
<rect x="920.0" y="410" width="800.0" height="335" rx="22" fill="#E7F1EC"/>
<text x="954.0" y="466" font-size="37" font-weight="700" fill="#172D35">Implementation and support</text>
<text x="954.0" y="518" font-size="31" font-weight="400" fill="#172D35">Has a proposal been accepted?</text>
<text x="954.0" y="569" font-size="31" font-weight="400" fill="#172D35">Have the new rules been activated?</text>
<text x="954.0" y="620" font-size="31" font-weight="400" fill="#172D35">Do wallets, exchanges and custodians</text>
<text x="954.0" y="661" font-size="31" font-weight="400" fill="#172D35">support it?</text>
<rect x="80.0" y="775" width="800.0" height="335" rx="22" fill="#F1EBDD"/>
<text x="114.0" y="831" font-size="37" font-weight="700" fill="#172D35">Holder action</text>
<text x="114.0" y="883" font-size="31" font-weight="400" fill="#172D35">Who needs to sign or move funds?</text>
<text x="114.0" y="934" font-size="31" font-weight="400" fill="#172D35">How are holders notified?</text>
<text x="114.0" y="985" font-size="31" font-weight="400" fill="#172D35">What migration and recovery routes are</text>
<text x="114.0" y="1026" font-size="31" font-weight="400" fill="#172D35">available?</text>
<rect x="920.0" y="775" width="800.0" height="335" rx="22" fill="#F1EBDD"/>
<text x="954.0" y="831" font-size="37" font-weight="700" fill="#172D35">Funds left behind</text>
<text x="954.0" y="883" font-size="31" font-weight="400" fill="#172D35">Is there a deadline?</text>
<text x="954.0" y="934" font-size="31" font-weight="400" fill="#172D35">Would spending rights change?</text>
<text x="954.0" y="985" font-size="31" font-weight="400" fill="#172D35">What evidence supports any proposed</text>
<text x="954.0" y="1026" font-size="31" font-weight="400" fill="#172D35">restriction?</text>
<rect x="80.0" y="1140" width="1640.0" height="220" rx="22" fill="#E7F1EC"/>
<text x="114.0" y="1196" font-size="37" font-weight="700" fill="#172D35">Time for voluntary migration</text>
<text x="114.0" y="1248" font-size="31" font-weight="400" fill="#172D35">Nic Carter discusses the work beyond a software upgrade. His remarks aren&#x27;t an</text>
<text x="114.0" y="1289" font-size="31" font-weight="400" fill="#172D35">endorsement of r8&#x27;s dates or forecasts.</text>
<text x="900" y="577.5" transform="rotate(-90 900 577.5)" text-anchor="middle" font-size="24" fill="#117F79" opacity="0.55">@balance0014</text>
<path d="M80 1455 H1720" stroke="#C5CFC8" stroke-width="2"/>
<text x="80" y="1505" font-size="30" font-weight="400" fill="#172D35">Use activation evidence, service support and completed migrations to track different parts of</text>
<text x="80" y="1547" font-size="30" font-weight="400" fill="#172D35">the proposal.</text>
<text x="80" y="1625" font-size="29" font-weight="700" fill="#117F79">Framework: @r8raq · Explanation: Balance Zhao</text>
<text x="80" y="1675" font-size="27" font-weight="400" fill="#52656B">Sources: R1, R4, P2, P3 · See sources.md for scope</text>
<text x="80" y="1725" font-size="26" font-weight="400" fill="#52656B">Sources reviewed 2026-10-31 · GitHub edition 2026-11-03</text>
