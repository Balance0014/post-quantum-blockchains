<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780">
<title>Two different measures of time</title>
<desc>r8&#x27;s assumed 2030 start and 10–20 year duration are separate from an idealized June 2024 UTXO processing calculation: about 76 days at full capacity or 305 at 25%. The calculation excludes agreement, deployment and holder response.</desc>
<rect width="1800" height="1780" fill="#F6F4EE"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="80" y="80" font-size="27" font-weight="700" fill="#117F79">BITCOIN / POST-QUANTUM MIGRATION</text>
<text x="1570" y="80" font-size="27" font-weight="700" fill="#117F79">02 / 04</text>
<text x="80" y="185" font-size="66" font-weight="700" fill="#172D35">Two different measures of time</text>
<text x="80" y="277" font-size="33" font-weight="400" fill="#52656B">r8&#x27;s overall scenario and a historical block-space model answer different questions.</text>
<rect x="80.0" y="410" width="1640.0" height="285" rx="22" fill="#F1EBDD"/>
<text x="114.0" y="466" font-size="37" font-weight="700" fill="#172D35">r8&#x27;s timing scenario</text>
<text x="114.0" y="518" font-size="31" font-weight="400" fill="#172D35">2030 + 10–20 years = 2040–2050</text>
<text x="114.0" y="569" font-size="31" font-weight="400" fill="#172D35">The start and duration are his assumptions. The addition does not establish either one.</text>
<rect x="80.0" y="725" width="800.0" height="375" rx="22" fill="#E7F1EC"/>
<text x="114.0" y="781" font-size="37" font-weight="700" fill="#172D35">100% of model capacity</text>
<text x="114.0" y="833" font-size="31" font-weight="400" fill="#172D35">About 76 days</text>
<text x="114.0" y="884" font-size="31" font-weight="400" fill="#172D35">186,676,874 UTXOs</text>
<text x="114.0" y="935" font-size="31" font-weight="400" fill="#172D35">17,020 upgrades per block</text>
<text x="114.0" y="986" font-size="31" font-weight="400" fill="#172D35">10 minutes per block; round up to 10,969</text>
<text x="114.0" y="1027" font-size="31" font-weight="400" fill="#172D35">whole blocks.</text>
<rect x="920.0" y="725" width="800.0" height="375" rx="22" fill="#E7F1EC"/>
<text x="954.0" y="781" font-size="37" font-weight="700" fill="#172D35">25% of model capacity</text>
<text x="954.0" y="833" font-size="31" font-weight="400" fill="#172D35">About 305 days</text>
<text x="954.0" y="884" font-size="31" font-weight="400" fill="#172D35">76.1736 ÷ 0.25 = 304.6944</text>
<text x="954.0" y="935" font-size="31" font-weight="400" fill="#172D35">An idealized processing calculation using</text>
<text x="954.0" y="976" font-size="31" font-weight="400" fill="#172D35">the June 2024 snapshot.</text>
<rect x="80.0" y="1130" width="1640.0" height="265" rx="22" fill="#F1EBDD"/>
<text x="114.0" y="1186" font-size="37" font-weight="700" fill="#172D35">Model assumptions and limits</text>
<text x="114.0" y="1238" font-size="31" font-weight="400" fill="#172D35">Unchanged block rules, ideal packing and omitted overhead.</text>
<text x="114.0" y="1289" font-size="31" font-weight="400" fill="#172D35">Agreement, development, deployment and holder response are outside this calculation. It</text>
<text x="114.0" y="1330" font-size="31" font-weight="400" fill="#172D35">does not establish a 10–20 year migration.</text>
<text x="900" y="912.5" transform="rotate(-90 900 912.5)" text-anchor="middle" font-size="24" fill="#117F79" opacity="0.55">@balance0014</text>
<path d="M80 1455 H1720" stroke="#C5CFC8" stroke-width="2"/>
<text x="80" y="1505" font-size="30" font-weight="400" fill="#172D35">UTXOs are unspent transaction outputs. Counting all outputs differs from protecting a chosen</text>
<text x="80" y="1547" font-size="30" font-weight="400" fill="#172D35">share of BTC value.</text>
<text x="80" y="1625" font-size="29" font-weight="700" fill="#117F79">Framework: @r8raq · Explanation: Balance Zhao</text>
<text x="80" y="1675" font-size="27" font-weight="400" fill="#52656B">Sources: R1, R3, P1 · See sources.md for scope</text>
<text x="80" y="1725" font-size="26" font-weight="400" fill="#52656B">Sources reviewed 2026-10-31 · GitHub edition 2026-11-03</text>
</g>
</svg>
