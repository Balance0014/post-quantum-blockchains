<text x="75" y="1258" font-size="28" fill="#172D35" font-weight="550">Nic Carter 也谈到：软件升级之外，还要为持有人自愿迁移留出时间。</text>
<text x="75" y="1298" font-size="24" fill="#52656B">访谈：The Delphi Podcast · 2026-01-09 · 30:07—32:18</text>
