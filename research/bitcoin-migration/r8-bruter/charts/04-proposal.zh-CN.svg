<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1470" viewBox="0 0 1800 1470">
<rect width="1800" height="1470" fill="#F6F4EE"/>
<g font-family="PingFang SC, Heiti SC, Arial, sans-serif">
<text x="75" y="55" font-size="29" fill="#117F79" font-weight="650">BRUTER · 4/4</text>
<text x="1370" y="55" font-size="29" fill="#117F79" font-weight="650">理论与观点：@r8raq</text>
<text x="75" y="155" font-size="62" fill="#172D35" font-weight="650">一个迁移方案，需要回答什么？</text>
<text x="75" y="220" font-size="33" fill="#52656B" font-weight="400">先看网络规则，再看持有人需要做什么。</text>
<rect x="75" y="280" width="800" height="510" rx="22" fill="#E7F1EC"/>
<text x="112" y="350" font-size="42" fill="#172D35" font-weight="650">网络与服务方</text>
<text x="112" y="430" font-size="32" fill="#172D35" font-weight="400">哪些签名或花费条件会改变？</text>
<text x="112" y="495" font-size="32" fill="#172D35" font-weight="400">哪些资金受到新规则保护？</text>
<text x="112" y="560" font-size="32" fill="#172D35" font-weight="400">钱包、交易所要配合哪些更新？</text>
<text x="112" y="625" font-size="32" fill="#172D35" font-weight="400">方案通过、代码上线、服务接入，</text>
<text x="112" y="690" font-size="32" fill="#172D35" font-weight="400">分别到了哪一步？</text>
<rect x="925" y="280" width="800" height="510" rx="22" fill="#E7F1EC"/>
<text x="962" y="350" font-size="42" fill="#172D35" font-weight="650">持有人与未迁移资金</text>
<text x="962" y="430" font-size="32" fill="#172D35" font-weight="400">是否需要自己签名、转移资金？</text>
<text x="962" y="495" font-size="32" fill="#172D35" font-weight="400">通知方式与迁移期限是什么？</text>
<text x="962" y="560" font-size="32" fill="#172D35" font-weight="400">未迁移资金会保留哪些权利？</text>
<text x="962" y="625" font-size="32" fill="#172D35" font-weight="400">如需改变旧规则，</text>
<text x="962" y="690" font-size="32" fill="#172D35" font-weight="400">依据与影响是什么？</text>
<rect x="75" y="850" width="1650" height="240" rx="22" fill="#F1EBDD"/>
<text x="112" y="915" font-size="54" fill="#A97822" font-weight="650">长期未动 ≠ 私钥已丢失</text>
<text x="112" y="980" font-size="32" fill="#172D35" font-weight="400">链上是否长期没动，与持有人是否仍能支配资产，需要分别判断。</text>
<text x="112" y="1040" font-size="32" fill="#172D35" font-weight="400">不能仅凭多年没有交易，就认定持有人已经失去控制。</text>
</g>
<text x="900" y="550" transform="rotate(-90 900 550)" font-family="Arial, sans-serif" text-anchor="middle" font-size="34" font-weight="600" fill="#117F79" opacity="0.48">@balance0014</text>
<g font-family="PingFang SC, Heiti SC, Arial, sans-serif">
<path d="M75 1165 L1725 1165" stroke="#C5CFC8" stroke-width="2"/>
