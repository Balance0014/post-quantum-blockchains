<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780">
<title>两种不同口径的时间</title>
<desc>r8 假设的 2030 年起点和 10—20 年工期，与 2024 年 6 月 UTXO 容量算例分开呈现：全容量约 76 天，25% 容量约 305 天；不含共识、部署和持有人响应。</desc>
<rect width="1800" height="1780" fill="#F6F4EE"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="80" y="80" font-size="27" font-weight="700" fill="#117F79">比特币 / 抗量子迁移</text>
<text x="1570" y="80" font-size="27" font-weight="700" fill="#117F79">02 / 04</text>
<text x="80" y="185" font-size="66" font-weight="700" fill="#172D35">两种不同口径的时间</text>
<text x="80" y="277" font-size="33" font-weight="400" fill="#52656B">r8 的整体情景与历史区块容量模型，回答的是不同问题。</text>
<rect x="80.0" y="410" width="1640.0" height="285" rx="22" fill="#F1EBDD"/>
<text x="114.0" y="466" font-size="37" font-weight="700" fill="#172D35">r8 的时间情景</text>
<text x="114.0" y="518" font-size="31" font-weight="400" fill="#172D35">2030 年 + 10—20 年 = 2040—2050 年</text>
<text x="114.0" y="569" font-size="31" font-weight="400" fill="#172D35">起点和工期是他的设定，加法本身不能证明这两个输入。</text>
<rect x="80.0" y="725" width="800.0" height="375" rx="22" fill="#E7F1EC"/>
<text x="114.0" y="781" font-size="37" font-weight="700" fill="#172D35">使用模型容量的 100%</text>
<text x="114.0" y="833" font-size="31" font-weight="400" fill="#172D35">约 76 天</text>
<text x="114.0" y="884" font-size="31" font-weight="400" fill="#172D35">186,676,874 条 UTXO</text>
<text x="114.0" y="935" font-size="31" font-weight="400" fill="#172D35">每块处理 17,020 条</text>
<text x="114.0" y="986" font-size="31" font-weight="400" fill="#172D35">每块 10 分钟；向上取整为 10,969 块。</text>
<rect x="920.0" y="725" width="800.0" height="375" rx="22" fill="#E7F1EC"/>
<text x="954.0" y="781" font-size="37" font-weight="700" fill="#172D35">使用模型容量的 25%</text>
<text x="954.0" y="833" font-size="31" font-weight="400" fill="#172D35">约 305 天</text>
<text x="954.0" y="884" font-size="31" font-weight="400" fill="#172D35">76.1736 ÷ 0.25 = 304.6944</text>
<text x="954.0" y="935" font-size="31" font-weight="400" fill="#172D35">使用 2024 年 6 月快照的理想化处理算例。</text>
<rect x="80.0" y="1130" width="1640.0" height="265" rx="22" fill="#F1EBDD"/>
<text x="114.0" y="1186" font-size="37" font-weight="700" fill="#172D35">模型假设与范围</text>
<text x="114.0" y="1238" font-size="31" font-weight="400" fill="#172D35">区块规则不变、极限打包，并忽略部分开销。</text>
<text x="114.0" y="1289" font-size="31" font-weight="400" fill="#172D35">共识、开发、部署和持有人响应不在计算中，不能据此证明迁移需要 10—20 年。</text>
<text x="900" y="912.5" transform="rotate(-90 900 912.5)" text-anchor="middle" font-size="24" fill="#117F79" opacity="0.55">@balance0014</text>
<path d="M80 1455 H1720" stroke="#C5CFC8" stroke-width="2"/>
<text x="80" y="1505" font-size="30" font-weight="400" fill="#172D35">UTXO 是未花费的交易输出。按全部输出条数计算，与保护某一比例的 BTC 金额不同。</text>
<text x="80" y="1625" font-size="29" font-weight="700" fill="#117F79">框架：@r8raq · 图解整理：Balance Zhao</text>
<text x="80" y="1675" font-size="27" font-weight="400" fill="#52656B">来源：R1, R3, P1 · 适用范围见 sources.md</text>
<text x="80" y="1725" font-size="26" font-weight="400" fill="#52656B">来源核对 2026-10-31 · GitHub 版 2026-11-03</text>
</g>
</svg>
