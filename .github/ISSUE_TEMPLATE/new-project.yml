name: Submit a project
description: Add a project to the post-quantum blockchain map. Every claim needs a public primary source.
title: "Project: "
labels: ["project submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting. You'll get an automatic reply with link and duplicate checks, and a maintainer replies within 2 days; a review decision usually comes within 3 days. Each claim is checked against its sources before anything is listed, and the entry records the date it was checked. Listing is free and isn't for sale. See [what gets listed](https://github.com/Balance0014/post-quantum-blockchains#submit-a-project).
  - type: input
    id: name
    attributes:
      label: Project name and ticker
      placeholder: "Example Chain (EXC)"
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Website and code repository
      placeholder: "https://… · https://github.com/…"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What is it?
      options:
        - Layer 1 blockchain
        - Layer 2 or rollup
        - Sidechain, appchain or other network
        - Wallet
        - Library or SDK
        - Standard, proposal or research
        - Other
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Deployment status of the post-quantum feature
      options:
        - On by default on mainnet
        - Opt-in on mainnet (accounts, locks or scripts users choose)
        - Testnet or devnet
        - Demo or prototype
        - Planned or proposed
    validations:
      required: true
  - type: input
    id: scheme
    attributes:
      label: Scheme and parameter set
      description: What it is used for (transaction signatures, key exchange, proofs). For a proposal or standard that doesn't pick a scheme yet, write "None yet".
      placeholder: "ML-DSA-65 for transaction signatures"
    validations:
      required: false
  - type: textarea
    id: facts
    attributes:
      label: What has been deployed?
      description: Network, consensus, milestone and date, and what the post-quantum scheme protects.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Release notes, specifications, governance records or code pinned to a commit. One link per line, each with the claim it supports.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limits and classical dependencies
      description: Anything still on classical cryptography (old accounts, consensus keys, bridges, fallbacks), or conditions on the feature.
    validations:
      required: true
  - type: dropdown
    id: affiliation
    attributes:
      label: Your relationship to the project
      description: Choose all that apply.
      multiple: true
      options:
        - I work on or for this project
        - I hold its token or have another financial interest
        - No affiliation
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: Every claim above links to a public source, not only an announcement or press coverage.
          required: true
        - label: I haven't included seed phrases, private keys, private infrastructure details or personal contact information.
          required: true
        - label: My text can be published under the repository's license (CC BY-NC 4.0 with its additional permission for commercial use), as described in its LICENSE.
          required: true
