name: Website
# Builds the site from data/ and publishes it to GitHub Pages
# (https://balance0014.github.io/post-quantum-blockchains/). Pages must use "GitHub Actions" as its source.
# After each deploy it sends the page list to IndexNow (scripts/indexnow.py).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the site (Node renders each page ahead of time)
        run: python3 -B scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - name: Tell search engines about the pages (IndexNow)
        continue-on-error: true
        run: python3 -B scripts/indexnow.py
