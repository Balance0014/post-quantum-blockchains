name: Triage submissions
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  reply:
    if: contains(github.event.issue.labels.*.name, 'project submission') || contains(github.event.issue.labels.*.name, 'correction')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The issue text is read from the event file inside the script, never passed through the shell.
      - run: python3 -B scripts/triage.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
